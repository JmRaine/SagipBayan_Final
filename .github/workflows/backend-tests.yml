name: Backend tests

on:
  push:
    branches: [main, fixedfinal]
  pull_request:
    branches: [main, fixedfinal]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyApp/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MyApp/server/package-lock.json
      - run: npm ci
      - run: npm test